name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG (defaults to A24 on a24-port, SWEET elsewhere)
        default: ""
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main, a24-port]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || (github.ref_name == 'a24-port' && 'A24' || 'SWEET') }}

jobs:
  build:
    # Use the standard Intel runner to avoid macOS ARM queue congestion. Patch 0086
    # backports the IORPC.kernelContent field expected by Xcode 16's iig.
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: set -o pipefail; bash build.sh 2>&1 | tee build.log

      - name: Summarize compiler errors
        if: always()
        working-directory: dxb
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          log = Path("build.log")
          if not log.exists():
              raise SystemExit(0)
          lines = log.read_text(errors="replace").splitlines()
          ansi = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]")
          clean_lines = [ansi.sub("", line) for line in lines]
          matches = []
          for line in lines:
              clean = ansi.sub("", line).strip()
              if clean.startswith("[warning] Skipping patch") or clean.startswith("error: "):
                  continue
              if re.search(r"^.*?:\d+:\d+(?::\d+)?: (?:fatal )?error:\s", clean) or re.search(r"^(?:ld|clang): error:", clean) or re.search(r"^Undefined symbols for architecture", clean):
                  matches.append(clean)
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a") as out:
              out.write(f"### XNU build diagnostics\n\nFound {len(matches)} compiler/linker error lines.\n\n")
              for line in matches[:100]:
                  out.write("- `" + line.replace("`", "'") + "`\n")
              out.write("\n### Build log tail\n\n```text\n")
              out.write("\n".join(lines[-50:]))
              out.write("\n```\n")
          if matches:
              combined = "\n".join(matches[:40])
              safe = combined.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=XNU compiler diagnostics ({len(matches)})::{safe}")
          tail = "\n".join(clean_lines[-35:])
          safe = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=XNU build log tail::{safe}")
          PY

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import traceback
          sys.path.insert(0, "tools")

          lines = []
          try:
              import mkpayload
              out = Path("out")
              sums = out / "SHA256SUMS"
              if sums.exists():
                  lines.append("SHA256SUMS:\n" + sums.read_text().strip())
              for k in sorted(out.glob("kernel.*")):
                  if k.is_dir() or k.suffix in (".dSYM", ".unstripped"):
                      continue
                  data = bytearray(k.read_bytes())
                  lines.append(f"file={k.name} size={len(data)}")
                  for cmd in (["file", str(k)], ["lipo", "-info", str(k)]):
                      res = subprocess.run(cmd, capture_output=True, text=True)
                      lines.append(res.stdout.strip())
                  undef = subprocess.run(["nm", "-u", str(k)], capture_output=True, text=True).stdout.strip().splitlines()
                  lines.append(f"undefined_symbols={len(undef)}")
                  nm_all = subprocess.run(["nm", str(k)], capture_output=True, text=True).stdout
                  want = [
                      "_start_first_cpu",
                      "_arm_init",
                      "_PE_init_platform",
                      "_sweet_hfs_register",
                      "_sweet_amfi_policy_register",
                      "_sweet_vtimer_intid",
                      "__ZN19SweetPlatformExpert5startEP9IOService",
                      "__ZN8SweetCPU5startEP9IOService",
                  ]
                  found = {}
                  for line in nm_all.splitlines():
                      parts = line.split()
                      if len(parts) >= 3 and parts[2] in want:
                          found[parts[2]] = f"{parts[0]} ({parts[1]})"
                  for sym in want:
                      lines.append(f"sym {sym}: {found.get(sym, 'MISSING')}")
                  m = mkpayload.parse_macho(bytes(data))
                  nfix = mkpayload.apply_chained_fixups(data, m)
                  lines.append(f"entry=0x{m['entry']:x} chained_fixups_applied={nfix}")
                  for seg in m["segs"]:
                      vm = seg["vmaddr"]
                      vmend = vm + seg["vmsize"]
                      lines.append(f"seg {seg['name']:16s} vm=0x{vm:016x}..0x{vmend:016x} foff=0x{seg['fileoff']:x} fsz=0x{seg['filesize']:x}")
          except Exception:
              lines.append("ERROR:\n" + traceback.format_exc())
          report = "\n".join(lines)
          print(report)
          safe = report.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=XNU kernel verification::{safe}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
